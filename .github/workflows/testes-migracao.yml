name: Testes de regressao da migracao
on:
  pull_request:
    paths:
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/testes-migracao.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar arquivos, sintaxe e integracao de interface
        run: node tests/migracao-smoke.test.cjs
      - name: Testar partilha e preservacao de rotas
        run: node tests/partilhar-paradas.test.cjs
      - name: Testar pinos individuais e refinamento da rota
        run: node tests/pinos-otimizacao.test.cjs
      - name: Testar setas da curva, mapa e navegação
        run: node tests/manobras-visuais.test.cjs
      - name: Testar CSS, manobra única, voz e cache V83
        run: node tests/regressao-visual-v83.test.cjs
      - name: Testar regras de finalização, histórico e setas V84
        run: node tests/rotas-finalizacao-v84.test.cjs
      - name: Testar execução da função finalizarRota e falhas de gravação
        run: node tests/finalizar-execucao-v84.test.cjs
      - name: Testar GPS no mapa livre após conclusão
        run: node tests/gps-mapa-livre-v842.test.cjs

  visual-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Chromium para testes reais de renderização CSS
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Conferir painel Android em Chromium e capturar renderização
        run: node tests/render-painel-v83.cjs
      - name: Testar cartografia real MapLibre em 2D e 3D
        run: node tests/render-mapa-v83.cjs
      - name: Testar persistência do histórico em IndexedDB e Desfazer
        run: node tests/rotas-persistencia-v84.cjs
      - name: Testar botões Entregue e Não entregue na tela Android
        run: node tests/render-botoes-v84.cjs
      - name: Guardar capturas de renderização do painel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-navegacao-e-botoes-v84
          path: artifacts/*.png
          if-no-files-found: ignore
