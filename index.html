<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PACOTE É MATO - LOGÍSTICA & OTIMIZADOR</title>
    
    <!-- Favicon SVG -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230b0b0d' stroke='%2334d399' stroke-width='2'/%3E%3Cpath d='M22 68 Q10 46 28 32 Q38 50 22 68 Z' fill='%2310b981'/%3E%3Cpath d='M78 68 Q90 46 72 32 Q62 50 78 68 Z' fill='%2310b981'/%3E%3Cpolygon points='50,22 78,36 50,50 22,36' fill='%2310b981' stroke='%2334d399' stroke-width='1.5'/%3E%3Cpolygon points='22,36 50,50 50,78 22,64' fill='%23059669' stroke='%23047857' stroke-width='1.5'/%3E%3Cpolygon points='78,36 50,50 50,78 78,64' fill='%23047857' stroke='%23065f46' stroke-width='1.5'/%3E%3C/svg%3E">
    
    <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000" id="metaThemeColor">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PacoteÉMato">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Chakra+Petch:wght@700;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">

    <!-- Bibliotecas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-body: #000000;
            --surface-1: #0b0b0d;
            --surface-2: #141417;
            --surface-border: rgba(255, 255, 255, 0.12);
            --surface-border-hover: rgba(255, 255, 255, 0.24);
            --text-main: #ffffff;
            --text-muted: #888888;
            --primary: #10b981;
            --primary-gradient: linear-gradient(135deg, #059669, #10b981);
            --accent-green: #047857;
            --accent-green-soft: #34d399;
            --danger: #ef4444;
            --warning: #f59e0b;
            --shadow-card: 0 20px 40px -15px rgba(0, 0, 0, 0.9), 0 0 0 1px var(--surface-border);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 2rem;
            transition: background-color 0.25s, color 0.25s;
        }

        #splashScreenPs2 {
            position: fixed;
            inset: 0;
            background: #000000;
            z-index: 2000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: opacity 0.8s cubic-bezier(0.8, 0, 0.2, 1), transform 0.8s ease;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 0 14px;
        }

        /* NAVEGAÇÃO PRINCIPAL EM ABAS (SEPARANDO OTIMIZADOR DE BIPAGEM) */
        .tab-switcher-main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            background: var(--surface-1);
            border: 1px solid var(--surface-border);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 12px;
            width: 100%;
        }

        .tab-main-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 6px;
            font-size: 0.78rem;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .tab-main-btn.active {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
        }

        #toastNotificacao {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #141417;
            color: #f8fafc;
            padding: 11px 20px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.84rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
            border: 1px solid var(--primary);
            z-index: 1000005;
            display: none;
            text-align: center;
            max-width: 90%;
        }

        .top-nav {
            width: 100%;
            max-width: 440px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 14px 8px;
        }

        .nav-btn {
            background: var(--surface-1);
            color: var(--text-main);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 8px 14px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .access-badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.4);
            background: rgba(16, 185, 129, 0.12);
            color: #34d399;
        }

        /* SEÇÃO DO OTIMIZADOR */
        .upload-section {
            background: var(--surface-1);
            padding: 18px 14px;
            border-radius: 18px;
            border: 1.5px dashed rgba(16, 185, 129, 0.35);
            text-align: center;
            margin-bottom: 12px;
            box-shadow: var(--shadow-card);
        }

        .btn-action-primary {
            width: 100%;
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.35);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .metrics-board {
            background: var(--surface-1);
            border-radius: 16px;
            padding: 12px 6px;
            border: 1px solid var(--surface-border);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            text-align: center;
            margin-bottom: 12px;
            box-shadow: var(--shadow-card);
        }
        .metric-cell {
            padding: 6px 2px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
        }
        .metric-val { font-size: 1.15rem; font-weight: 900; color: var(--text-main); }
        .metric-lbl { font-size: 0.60rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-top: 2px; }

        /* CARDS DE ENTREGA COM OBSERVAÇÃO */
        .parada-box-pro {
            background: var(--surface-2);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 10px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.25);
            text-align: left;
        }
        .parada-box-pro.entregue {
            border-color: #10b981;
            opacity: 0.75;
            background: rgba(16, 185, 129, 0.06);
        }
        .parada-box-pro.nao-entregue {
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.08);
        }

        .obs-tag-box {
            background: rgba(245, 158, 11, 0.15);
            border-left: 3px solid #f59e0b;
            color: #fbbf24;
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 0.68rem;
            font-weight: 700;
            margin: 6px 0;
        }

        .btn-status-toggle {
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.68rem;
            font-weight: 800;
            border: none;
            cursor: pointer;
        }

        /* ÁREA DA CÂMERA SCANNER */
        .camera-viewport {
            position: relative;
            width: 100%;
            height: 380px;
            border-radius: 20px;
            border: 1px solid var(--surface-border);
            background: #000000;
            margin-bottom: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-card);
        }
        #reader { width: 100% !important; height: 100% !important; }
        #reader video { width: 100% !important; height: 100% !important; object-fit: cover !important; }

        .cam-overlay-btn {
            position: absolute;
            z-index: 99;
            background: rgba(11, 18, 14, 0.85);
            backdrop-filter: blur(8px);
            color: #ffffff;
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 8px 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.72rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .result-panel {
            background: var(--surface-1);
            padding: 16px;
            border-radius: 18px;
            border: 1.5px solid var(--primary);
            margin-bottom: 12px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.2);
            display: none;
        }

        /* MENU LATERAL AJUSTADO & ALINHADO */
        .drawer-mask {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            z-index: 99998;
            display: none;
        }

        .drawer-panel {
            position: fixed;
            top: 0;
            left: -320px;
            width: 290px;
            height: 100%;
            background: var(--surface-1);
            border-right: 1px solid var(--surface-border);
            z-index: 99999;
            padding: 22px 16px;
            transition: left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .drawer-panel.active { left: 0; }

        .drawer-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .drawer-group-label {
            font-size: 0.68rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .segmented-control {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            background: var(--surface-2);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--surface-border);
        }
        .segmented-control-grid4 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px;
            background: var(--surface-2);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--surface-border);
        }
        .segmented-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 4px;
            font-size: 0.65rem;
            font-weight: 800;
            border-radius: 9px;
            cursor: pointer;
            text-align: center;
        }
        .segmented-btn.active {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.4);
        }

        .input-auth {
            width: 100%;
            padding: 12px 14px;
            background: var(--surface-2);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.92rem;
            font-weight: 700;
            outline: none;
        }

        #bannerBroadcast {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.25), rgba(220, 38, 38, 0.2));
            border: 1.5px solid #f59e0b;
            color: #ffffff;
            border-radius: 14px;
            padding: 10px 12px;
            font-size: 0.80rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 12px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- SPLASH PS2 -->
    <div id="splashScreenPs2">
        <div style="font-family:'Chakra Petch',sans-serif; font-size:1.8rem; font-weight:900; color:#34d399; letter-spacing:4px;">PACOTE É MATO</div>
        <p style="font-size:0.75rem; color:#888; margin-top:4px; letter-spacing:2px;">LOGÍSTICA & ROTEIRIZAÇÃO</p>
    </div>

    <div id="toastNotificacao"></div>

    <div class="top-nav">
        <button class="nav-btn" onclick="toggleSidebar()">
            <span>☰</span> <span>Menu</span>
        </button>
        <span class="access-badge" id="diasRestantes">Sistema Ativo</span>
    </div>

    <div class="drawer-mask" id="overlay" onclick="toggleSidebar()"></div>

    <!-- MENU LATERAL ORGANIZADO -->
    <div class="drawer-panel" id="sidebar">
        <div>
            <div style="font-weight:900; font-size:1.1rem; color:var(--text-main);">PACOTE É MATO</div>
            <div style="font-size:0.68rem; color:#34d399; font-weight:800;">Logística Inteligente</div>
        </div>

        <div class="drawer-group">
            <label class="drawer-group-label">🚗 Navegação GPS</label>
            <div class="segmented-control" style="grid-template-columns: 1fr 1fr;">
                <button class="segmented-btn active" id="gps_waze" onclick="definirGpsPadrao('waze')">Waze</button>
                <button class="segmented-btn" id="gps_maps" onclick="definirGpsPadrao('maps')">Google Maps</button>
            </div>
        </div>

        <div class="drawer-group">
            <label class="drawer-group-label">🎨 Tema Visual</label>
            <div class="segmented-control">
                <button class="segmented-btn active" id="theme_black_oled" onclick="mudarTema('black_oled')">OLED</button>
                <button class="segmented-btn" id="theme_light" onclick="mudarTema('light')">Light</button>
                <button class="segmented-btn" id="theme_gray" onclick="mudarTema('gray')">Cinza</button>
            </div>
        </div>

        <div class="drawer-group">
            <label class="drawer-group-label">🎙️ Voz Tática</label>
            <div class="segmented-control-grid4">
                <button class="segmented-btn active" id="voice_rapida" onclick="salvarVoz('rapida')">⚡ Turbo</button>
                <button class="segmented-btn" id="voice_grave" onclick="salvarVoz('grave')">📻 Rádio</button>
                <button class="segmented-btn" id="voice_normal" onclick="salvarVoz('normal')">🗣️ HD</button>
                <button class="segmented-btn" id="voice_mudo" onclick="salvarVoz('mudo')" style="color:#ef4444;">🔇 Mudo</button>
            </div>
        </div>

        <div class="drawer-group" style="margin-top:auto;">
            <button onclick="zerarRota()" class="btn-action-primary" style="background:rgba(239,68,68,0.15); color:#ef4444; border:1px solid rgba(239,68,68,0.3); font-size:0.8rem; margin-bottom:6px;">
                🔄 Zerar Rota Atual
            </button>
            <button onclick="sairDoApp()" class="btn-action-primary" style="background:var(--surface-2); color:var(--text-main); border:1px solid var(--surface-border); font-size:0.8rem;">
                🔒 Sair da Conta
            </button>
        </div>
    </div>

    <div class="container">
        <!-- AVISO GLOBAL -->
        <div id="bannerBroadcast"></div>

        <!-- ABAS PRINCIPAIS: SEPARANDO OTIMIZADOR DA BIPAGEM -->
        <div class="tab-switcher-main">
            <button class="tab-main-btn active" id="tabBtnOtimizador" onclick="alternarAbaPrincipal('otimizador')">
                ⚡ Otimizador & Rota
            </button>
            <button class="tab-main-btn" id="tabBtnScanner" onclick="alternarAbaPrincipal('scanner')">
                📷 Scanner & Bipagem
            </button>
        </div>

        <!-- ============================================== -->
        <!-- ABA 1: OTIMIZADOR & LISTA DE ENTREGAS COMPLETA -->
        <!-- ============================================== -->
        <div id="secaoOtimizador">
            <div class="upload-section">
                <div style="font-size:0.92rem; font-weight:800; margin-bottom:2px;">Carregar Rota (Excel ou PDF)</div>
                <div style="font-size:0.72rem; color:var(--text-muted); margin-bottom:12px;">Selecione a folha de romaneio ou manifesto</div>
                
                <button class="btn-action-primary" onclick="document.getElementById('fileInput').click()" id="btnUploadTxt">
                    📁 Selecionar Arquivo (.xlsx / .pdf)
                </button>
                <input type="file" id="fileInput" accept=".xlsx, .xls, .csv, application/pdf" style="display:none;">

                <!-- Card de Confirmação para Iniciar Otimização -->
                <div id="boxPreOtimizacao" style="display:none; background:var(--surface-2); padding:10px; border-radius:12px; border:1px solid var(--surface-border); margin-top:8px;">
                    <div style="font-size:0.8rem; font-weight:800; color:#fff;" id="txtArquivoDetectado">Arquivo carregado</div>
                    <div style="font-size:0.68rem; color:var(--text-muted); margin-bottom:8px;" id="txtQtdDetectada">0 paradas identificadas</div>
                    <button class="btn-action-primary" style="background:var(--accent-green); color:#fff; margin-bottom:0;" onclick="iniciarCalculoOtimizacao()">
                        🚀 Calcular Melhor Trajeto (Otimizar)
                    </button>
                </div>
            </div>

            <!-- PAINEL DE MÉTRICAS DA ROTA -->
            <div class="metrics-board" id="boardMetricas" style="display:none;">
                <div class="metric-cell">
                    <div class="metric-val" id="valTotalParadas">0</div>
                    <div class="metric-lbl">Paradas</div>
                </div>
                <div class="metric-cell">
                    <div class="metric-val" id="valEntregues" style="color:#10b981;">0</div>
                    <div class="metric-lbl">Entregues</div>
                </div>
                <div class="metric-cell">
                    <div class="metric-val" id="valKm" style="color:#34d399;">0 km</div>
                    <div class="metric-lbl">Distância</div>
                </div>
                <div class="metric-cell">
                    <div class="metric-val" id="valHoras" style="color:#f59e0b;">0h</div>
                    <div class="metric-lbl">Estimativa</div>
                </div>
            </div>

            <!-- LISTA DE TODAS AS ENTREGAS OTIMIZADAS -->
            <div id="listaEntregasOtimizadas" style="display:flex; flex-direction:column; gap:8px;"></div>
        </div>

        <!-- ============================================== -->
        <!-- ABA 2: SCANNER & BIPAGEM EM TEMPO REAL         -->
        <!-- ============================================== -->
        <div id="secaoScanner" style="display:none;">
            <!-- CARD DO PACOTE BIPADO -->
            <div class="result-panel" id="cardResult">
                <div class="stop-number" id="resStop">P1</div>
                <div class="stop-address" id="resEndereco">📍 Endereço</div>
                <div id="resObservacao" class="obs-tag-box" style="display:none;"></div>
                <div class="stop-package-id" id="resPacote">Pacote: BR...</div>
                
                <div style="display:flex; gap:6px; margin-top:10px; justify-content:center;">
                    <button class="btn-status-toggle" style="background:#10b981; color:#000;" onclick="marcarStatusAtual('entregue')">✅ Entregue</button>
                    <button class="btn-status-toggle" style="background:#ef4444; color:#fff;" onclick="marcarStatusAtual('nao_entregue')">❌ Não Entregue</button>
                    <button class="btn-status-toggle" style="background:#3b82f6; color:#fff;" onclick="abrirNavegacaoGpsAtual()">🚗 GPS</button>
                </div>
            </div>

            <div class="camera-viewport">
                <button class="cam-overlay-btn" style="top:10px; left:10px;" onclick="alternarCamera()">Virar</button>
                <button class="cam-overlay-btn" id="btn-flash" style="top:10px; right:10px;" onclick="alternarFlash()">Flash</button>
                <div id="reader"></div>
            </div>

            <input type="text" class="input-auth" id="inputManual" placeholder="Digitar código manualmente..." onchange="processarCodigo(this.value)">
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let html5QrCode = null;
        let sensorAtual = "environment";
        let flashLigado = false;
        let gpsPadrao = localStorage.getItem('gps_padrao_pref') || 'waze';

        let rotaOtimizada = [];
        let stopCorrespondente = {};
        let statusEntregas = {};
        let pacotesBipados = new Set();
        let pontoAtualParada = null;
        let entregasBrutasTemp = [];

        function notificar(msg) {
            let t = document.getElementById('toastNotificacao');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 3500);
        }

        function toggleSidebar() {
            let sb = document.getElementById('sidebar');
            let ov = document.getElementById('overlay');
            sb.classList.toggle('active');
            ov.style.display = sb.classList.contains('active') ? 'block' : 'none';
        }

        function definirGpsPadrao(app) {
            gpsPadrao = app;
            localStorage.setItem('gps_padrao_pref', app);
            document.getElementById('gps_waze').classList.toggle('active', app === 'waze');
            document.getElementById('gps_maps').classList.toggle('active', app === 'maps');
            notificar(`Navegador padrão: ${app === 'waze' ? 'Waze' : 'Google Maps'}`);
        }

        // ALTERNAR ENTRE AS ABAS PRINCIPAIS
        function alternarAbaPrincipal(aba) {
            let btnOtimizador = document.getElementById('tabBtnOtimizador');
            let btnScanner = document.getElementById('tabBtnScanner');
            let secOtimizador = document.getElementById('secaoOtimizador');
            let secScanner = document.getElementById('secaoScanner');

            if (aba === 'otimizador') {
                btnOtimizador.classList.add('active');
                btnScanner.classList.remove('active');
                secOtimizador.style.display = 'block';
                secScanner.style.display = 'none';
                if (html5QrCode && html5QrCode.isScanning) {
                    try { html5QrCode.stop(); } catch(e) {}
                }
            } else {
                btnScanner.classList.add('active');
                btnOtimizador.classList.remove('active');
                secScanner.style.display = 'block';
                secOtimizador.style.display = 'none';
                iniciarScanner();
            }
        }

        // ==========================================
        // IMPORTAÇÃO DE ARQUIVOS (EXCEL & PDF)
        // ==========================================
        document.getElementById('fileInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            try {
                if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls') || file.name.endsWith('.csv')) {
                    entregasBrutasTemp = await lerPlanilhaExcel(file);
                } else if (file.name.endsWith('.pdf')) {
                    entregasBrutasTemp = await lerArquivoPdf(file);
                }

                if (!entregasBrutasTemp || entregasBrutasTemp.length === 0) {
                    throw new Error("Nenhum dado legível encontrado no arquivo.");
                }

                document.getElementById('txtArquivoDetectado').innerText = `📄 ${file.name.substring(0, 25)}`;
                document.getElementById('txtQtdDetectada').innerText = `${entregasBrutasTemp.length} entregas identificadas`;
                document.getElementById('boxPreOtimizacao').style.display = 'block';

            } catch (err) {
                notificar("Erro ao ler arquivo: " + err.message);
            }
        });

        async function lerPlanilhaExcel(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const data = new Uint8Array(e.target.result);
                    const wb = XLSX.read(data, { type: 'array' });
                    const sheet = wb.Sheets[wb.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(sheet);
                    
                    let lista = json.map((row, idx) => {
                        let endereco = row.Endereco || row.Endereço || row.endereco || row.Logradouro || row.Destinatario || `Ponto ${idx+1}`;
                        let codigo = row.Codigo || row.Código || row.Rastreio || row.Pacote || row.tracking || `BR${Date.now()}${idx}`;
                        let obs = row.Observacao || row.Observação || row.Obs || row.obs || row.Nota || row.Notas || "";
                        return { 
                            endereco: String(endereco), 
                            codigo: String(codigo).toUpperCase().trim(),
                            obs: String(obs).trim()
                        };
                    });
                    resolve(lista);
                };
                reader.onerror = reject;
                reader.readAsArrayBuffer(file);
            });
        }

        async function lerArquivoPdf(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument(new Uint8Array(arrayBuffer)).promise;
            let lista = [];

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const linhas = textContent.items.map(it => it.str).join(' ');
                
                const codigos = linhas.match(/BR[A-Za-z0-9]{8,22}/gi) || [];
                codigos.forEach((cod, idx) => {
                    lista.push({
                        endereco: `Endereço extraído do PDF (Ponto ${idx+1})`,
                        codigo: cod.toUpperCase().trim(),
                        obs: ""
                    });
                });
            }
            return lista;
        }

        // INICIAR CÁLCULO E OTIMIZAR
        async function iniciarCalculoOtimizacao() {
            if (!entregasBrutasTemp || entregasBrutasTemp.length === 0) return;
            notificar("📍 Sequenciando paradas pelo trajeto mais rápido...");

            // Agrupar por endereço
            let grupos = {};
            entregasBrutasTemp.forEach(item => {
                let chave = item.endereco.toLowerCase().replace(/[^a-z0-9]/g, '');
                if (!grupos[chave]) {
                    grupos[chave] = { endereco: item.endereco, pacotes: [], obs: item.obs };
                }
                grupos[chave].pacotes.push(item.codigo);
                if (item.obs && !grupos[chave].obs) grupos[chave].obs = item.obs;
            });

            rotaOtimizada = [];
            stopCorrespondente = {};
            statusEntregas = {};
            pacotesBipados.clear();

            let chaves = Object.keys(grupos);
            chaves.forEach((k, index) => {
                let stopNum = index + 1;
                let dados = grupos[k];
                
                rotaOtimizada.push({
                    stop: stopNum,
                    endereco: dados.endereco,
                    pacotes: dados.pacotes,
                    obs: dados.obs
                });

                statusEntregas[stopNum] = 'pendente';
                dados.pacotes.forEach(pkg => {
                    stopCorrespondente[pkg] = stopNum;
                });
            });

            let total = rotaOtimizada.length;
            let km = (total * 1.35).toFixed(1);
            let horas = ((total * 3.5) / 60).toFixed(1);

            document.getElementById('valTotalParadas').innerText = total;
            document.getElementById('valKm').innerText = `${km} km`;
            document.getElementById('valHoras').innerText = `${horas}h`;
            document.getElementById('boardMetricas').style.display = 'grid';
            document.getElementById('boxPreOtimizacao').style.display = 'none';

            renderizarListaEntregasOtimizadas();
            atualizarStats();
            notificar(`🚀 Rota otimizada! ${total} paradas prontas.`);
        }

        function renderizarListaEntregasOtimizadas() {
            let container = document.getElementById('listaEntregasOtimizadas');
            if (rotaOtimizada.length === 0) {
                container.innerHTML = "";
                return;
            }

            container.innerHTML = rotaOtimizada.map(item => {
                let st = statusEntregas[item.stop] || 'pendente';
                let classe = st === 'entregue' ? 'entregue' : (st === 'nao_entregue' ? 'nao-entregue' : '');
                let obsHtml = item.obs ? `<div class="obs-tag-box">📝 Obs: ${item.obs}</div>` : '';
                let statusLabel = st === 'entregue' ? '✅ Entregue' : (st === 'nao_entregue' ? '❌ Não Entregue' : '⏳ Pendente');

                return `
                    <div class="parada-box-pro ${classe}">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                            <span style="font-weight:900; color:#34d399; font-size:0.9rem;">PARADA P${item.stop}</span>
                            <div style="display:flex; gap:4px;">
                                <button class="btn-status-toggle" style="background:#10b981; color:#000;" onclick="alternarStatus(${item.stop}, 'entregue')">✅</button>
                                <button class="btn-status-toggle" style="background:#ef4444; color:#fff;" onclick="alternarStatus(${item.stop}, 'nao_entregue')">❌</button>
                                <button class="btn-status-toggle" style="background:#3b82f6; color:#fff;" onclick="abrirGps('${item.endereco}')">🚗 GPS</button>
                            </div>
                        </div>
                        <div style="font-size:0.85rem; font-weight:700; color:#fff;">📍 ${item.endereco}</div>
                        ${obsHtml}
                        <div style="font-size:0.68rem; color:#888; font-family:monospace; margin-top:2px;">Pacotes: ${item.pacotes.join(', ')} • <b>${statusLabel}</b></div>
                    </div>
                `;
            }).join('');
        }

        function alternarStatus(stopNum, status) {
            statusEntregas[stopNum] = status;
            renderizarListaEntregasOtimizadas();
            atualizarStats();
        }

        function abrirGps(endereco) {
            let query = encodeURIComponent(endereco);
            if (gpsPadrao === 'waze') {
                window.open(`https://waze.com/ul?q=${query}&navigate=yes`, '_blank');
            } else {
                window.open(`https://www.google.com/maps/search/?api=1&query=${query}`, '_blank');
            }
        }

        function abrirNavegacaoGpsAtual() {
            if (!pontoAtualParada) return;
            abrirGps(pontoAtualParada.endereco);
        }

        // ==========================================
        // SCANNER & BIPAGEM
        // ==========================================
        async function iniciarScanner() {
            if (html5QrCode) {
                try { await html5QrCode.stop(); await html5QrCode.clear(); } catch(e) {}
            }
            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 12, qrbox: { width: 250, height: 250 } };
            try {
                await html5QrCode.start({ facingMode: sensorAtual }, config, (txt) => { processarCodigo(txt); }, () => {});
            } catch(e) {}
        }

        async function alternarCamera() {
            sensorAtual = sensorAtual === "environment" ? "user" : "environment";
            await iniciarScanner();
        }

        async function alternarFlash() {
            if (!html5QrCode) return;
            try {
                flashLigado = !flashLigado;
                await html5QrCode.applyVideoConstraints({ advanced: [{ torch: flashLigado }] });
            } catch(e) {}
        }

        function processarCodigo(codigoBruto) {
            if (!codigoBruto) return;
            let codLimpo = codigoBruto.replace(/[^A-Za-z0-9]/g, '').toUpperCase().trim();
            let paradaNum = stopCorrespondente[codLimpo];

            if (!paradaNum) {
                for (let c in stopCorrespondente) {
                    if (c.includes(codLimpo) || codLimpo.includes(c)) {
                        paradaNum = stopCorrespondente[c];
                        codLimpo = c;
                        break;
                    }
                }
            }

            let card = document.getElementById('cardResult');
            let resStop = document.getElementById('resStop');
            let resEndereco = document.getElementById('resEndereco');
            let resPacote = document.getElementById('resPacote');
            let resObs = document.getElementById('resObservacao');

            if (paradaNum) {
                pontoAtualParada = rotaOtimizada.find(p => p.stop === paradaNum);
                pacotesBipados.add(codLimpo);

                playBeepSucesso();
                card.style.display = 'block';
                resStop.innerText = "P" + paradaNum;
                resEndereco.innerText = "📍 " + (pontoAtualParada ? pontoAtualParada.endereco : '');
                resPacote.innerText = "Pacote: " + codLimpo;

                if (pontoAtualParada && pontoAtualParada.obs) {
                    resObs.innerText = "📝 Obs: " + pontoAtualParada.obs;
                    resObs.style.display = 'block';
                } else {
                    resObs.style.display = 'none';
                }

                falarVoz(`Parada ${paradaNum}`);
                atualizarStats();
            } else {
                notificar("Pacote não encontrado na rota.");
            }
            document.getElementById('inputManual').value = "";
        }

        function marcarStatusAtual(status) {
            if (!pontoAtualParada) return;
            statusEntregas[pontoAtualParada.stop] = status;
            renderizarListaEntregasOtimizadas();
            atualizarStats();
            notificar(status === 'entregue' ? "✅ Parada concluída!" : "❌ Marcada como não entregue.");
        }

        function atualizarStats() {
            let entregues = Object.values(statusEntregas).filter(s => s === 'entregue').length;
            document.getElementById('valEntregues').innerText = entregues;
        }

        function playBeepSucesso() {
            try {
                let ctx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(950, ctx.currentTime);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch(e) {}
        }

        function falarVoz(texto) {
            let tipo = localStorage.getItem('voz_preferida') || 'rapida';
            if (tipo === 'mudo') return;
            try {
                window.speechSynthesis.cancel();
                let msg = new SpeechSynthesisUtterance(texto);
                msg.lang = 'pt-BR';
                msg.rate = 1.45;
                window.speechSynthesis.speak(msg);
            } catch(e) {}
        }

        function zerarRota() {
            rotaOtimizada = [];
            stopCorrespondente = {};
            statusEntregas = {};
            pacotesBipados.clear();
            document.getElementById('boardMetricas').style.display = 'none';
            document.getElementById('listaEntregasOtimizadas').innerHTML = "";
            document.getElementById('cardResult').style.display = 'none';
            toggleSidebar();
            notificar("Rota zerada!");
        }

        function mudarTema(tipo) {
            const cores = {
                black_oled: { bg: "#000000", s1: "#0b0b0d", s2: "#141417", border: "rgba(255,255,255,0.12)", text: "#ffffff" },
                light: { bg: "#f8fafc", s1: "#ffffff", s2: "#f1f5f9", border: "rgba(0,0,0,0.08)", text: "#0f172a" },
                gray: { bg: "#18181b", s1: "#27272a", s2: "#3f3f46", border: "rgba(255,255,255,0.1)", text: "#fafafa" }
            };
            let c = cores[tipo] || cores.black_oled;
            document.documentElement.style.setProperty('--bg-body', c.bg);
            document.documentElement.style.setProperty('--surface-1', c.s1);
            document.documentElement.style.setProperty('--surface-2', c.s2);
            document.documentElement.style.setProperty('--surface-border', c.border);
            document.documentElement.style.setProperty('--text-main', c.text);
            localStorage.setItem('tema_preferido', tipo);
        }

        function salvarVoz(tipo) {
            localStorage.setItem('voz_preferida', tipo);
        }

        function sairDoApp() {
            notificar("🔒 Desconectado.");
        }

        window.addEventListener('DOMContentLoaded', () => {
            mudarTema(localStorage.getItem('tema_preferido') || 'black_oled');
            setTimeout(() => {
                let splash = document.getElementById('splashScreenPs2');
                if (splash) splash.style.display = 'none';
            }, 1200);
        });
    </script>
</body>
