const svg=document.querySelector('svg');const tmp=document.createElementNS('http://www.w3.org/2000/svg','path');tmp.setAttribute('d',path);svg.appendChild(tmp);tmp.style.visibility='hidden';
window.renderProgress=p=>{const len=tmp.getTotalLength(),cut=len*p/100,step=4;let pastPts=[],futurePts=[];for(let d=0;d<=len;d+=step){const pt=tmp.getPointAtLength(Math.min(d,len));(d<=cut?pastPts:futurePts).push([pt.x,pt.y]);}const snap=tmp.getPointAtLength(cut);pastPts.push([snap.x,snap.y]);futurePts.unshift([snap.x,snap.y]);const dstr=a=>a.length?'M'+a.map(q=>q.join(' ')).join(' L'):'';document.getElementById('past').setAttribute('d',dstr(pastPts));document.getElementById('futureCase').setAttribute('d',dstr(futurePts));document.getElementById('future').setAttribute('d',dstr(futurePts));document.getElementById('car').setAttribute('transform',`translate(${snap.x} ${snap.y}) rotate(-18)`);document.getElementById('badge').textContent=`BROWSER HARNESS · PROGRESSO ${p}%`;document.getElementById('diag').innerHTML=`Passado: <b>cinza-esverdeado 20%</b> · Futuro: <b>verde forte</b> · SOURCE_ROUTE_STATUS recortado no mesmo ponto`;};
