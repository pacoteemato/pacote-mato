<!DOCTYPE html>
<html>
<body>
  <canvas id="c192" width="192" height="192" style="display:none;"></canvas>
  <canvas id="c512" width="512" height="512" style="display:none;"></canvas>
  <script>
    const svgData = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' fill='#0b0b0d'/><g transform='translate(0, 0)'><path d='M90 360 Q20 230 120 150 Q170 250 90 360 Z' fill='#10b981'/><path d='M422 360 Q492 230 392 150 Q342 250 422 360 Z' fill='#10b981'/><polygon points='256,90 422,170 256,250 90,170' fill='#10b981' stroke='#34d399' stroke-width='10'/><polygon points='90,170 256,250 256,422 90,342' fill='#059669' stroke='#047857' stroke-width='10'/><polygon points='422,170 256,250 256,422 422,342' fill='#047857' stroke='#065f46' stroke-width='10'/><path d='M256 90 L256 250 M170 210 L342 210' stroke='#a7f3d0' stroke-width='14' stroke-linecap='round'/><path d='M256 422 Q190 310 256 198 Q322 310 256 422 Z' fill='#34d399'/></g></svg>`;
    
    function downloadPNG(size, name) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const img = new Image();
      img.onload = () => {
        ctx.drawImage(img, 0, 0, size, size);
        const a = document.createElement('a');
        a.download = name;
        a.href = canvas.toDataURL('image/png');
        a.click();
      };
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgData);
    }
    
    window.onload = () => {
      downloadPNG(192, 'icon-192.png');
      setTimeout(() => downloadPNG(512, 'icon-512.png'), 500);
    };
  </script>
</body>
</html>
